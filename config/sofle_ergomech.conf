# Sofle Ergomech - Beginner-Friendly & Programmer-Optimized Configuration
# Configuration for coding (C/C++, Python, Rust) + gaming (GuildWars2) + Norwegian/English typing

# ==================== DISPLAY SUPPORT ====================
# Uncomment to enable OLED display support
CONFIG_ZMK_DISPLAY=y

# ==================== ENCODER SUPPORT ====================
# Encoder configuration for left-side roller encoder
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# ==================== RGB UNDERGLOW ====================
# RGB underglow/backlight support
CONFIG_ZMK_RGB_UNDERGLOW=n
CONFIG_ZMK_POINTING=y

# Disable toggling external power with underglow
# (keeps display on when RGB toggles)
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n

# ==================== BEHAVIOR TIMING ====================
# Adjust these based on your typing speed/preference
# CONFIG_ZMK_HOLD_TAP_DECISION_POINT=100  # removed; unsupported symbol

# ==================== KEYBOARD OUTPUT ====================
# USB output timeout (milliseconds, 0 = always on)
CONFIG_ZMK_USB_LOGGING=y

# ==================== DEBOUNCE ====================
# Debounce timing for reliable key detection
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# ==================== COMBO SUPPORT ====================
# Enable combo feature for quick key combinations
CONFIG_ZMK_COMBO_MAX_COMBOS_PER_KEY=8
CONFIG_ZMK_COMBO_MAX_KEYS_PER_COMBO=3

# ==================== MACRO SUPPORT ====================
# Enable macros for programming shortcuts and gaming commands
# CONFIG_ZMK_MACRO_MAX_WAIT_MS=100  # removed; unsupported symbol

# ==================== BT SETTINGS ====================
# Bluetooth configuration
CONFIG_ZMK_BLE_CLEAR_BONDS_ON_START=n

# ==================== POWER MANAGEMENT ====================
# USB sleep timeout (milliseconds)
# CONFIG_ZMK_USB_IDLE_TIMEOUT=30000  # removed; unsupported symbol

# BLE idle timeout before sleeping (milliseconds)
# CONFIG_ZMK_BLE_SLEEP_TIMEOUT=900000  # removed; unsupported symbol

# ==================== COMPATIBILITY ====================
# Enable extended HID report length for full compatibility
# CONFIG_ZMK_HID_EXTENDED_REPORT=n  # removed; unsupported symbol

# ==================== LOGGING ====================
# Enable debug logging if needed (disable for production)
# CONFIG_LOG=y
# CONFIG_ZMK_LOG_LEVEL_DEFAULT=3
